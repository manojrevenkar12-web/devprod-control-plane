[project]
name = "devprod-control-plane"
version = "0.1.0"
description = "From first commit to production, measured: CI failure triage agent, flaky-test quarantine, affected-module CI, progressive delivery across customer AWS accounts, paved roads and DevProd metrics."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "polars>=1.30",
  "numpy>=2.2",
  "scipy>=1.15",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "typer>=0.16",
  "fastapi>=0.118",
  "uvicorn>=0.35",
  "httpx>=0.28",
  "boto3>=1.40",
  "mcp>=2.0",
  "claude-agent-sdk>=0.2",
  "opentelemetry-sdk>=1.36",
  "psycopg[binary]>=3.2",
]

[project.scripts]
devprod = "devprod.cli:app"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1", "hypothesis>=6.135", "ruff>=0.13",
       "moto[cloudformation,lambda,codedeploy,cloudwatch,sts,s3,ssm]>=5.1", "cfn-lint>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devprod"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: runs the whole simulation", "db: needs PostgreSQL (DEVPROD_TEST_DATABASE_URL)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF046", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/devprod/sim/logs.py" = ["E501"]   # log lines are what CI prints
"src/devprod/report.py" = ["E501"]
"src/devprod/paved/scaffold.py" = ["E501"]   # file templates
"src/devprod/cli.py" = ["B008"]               # typer options
