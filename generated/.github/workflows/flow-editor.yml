# Generated by `devprod workflows`. Do not edit; change src/devprod/ci/workflows.py.
name: ci / flow-editor
'on':
  pull_request:
    paths:
    - frontend/flow-editor/**
    - frontend/ui-kit/**
    - .github/workflows/flow-editor.yml
  merge_group: {}
permissions:
  contents: read
concurrency:
  group: ci-flow-editor-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on:
    - self-hosted
    - linux
    - arm64
    - ci-typescript
    - small
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - id: plan
      run: echo "shards=$(uvx --from ./tools/devprod devprod plan-shards flow-editor --target-minutes 6 --max 8)" >> "$GITHUB_OUTPUT"
  test:
    needs: plan
    runs-on:
    - self-hosted
    - linux
    - arm64
    - ci-typescript
    - medium
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
    - uses: actions/checkout@v5
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile --filter flow-editor...
    - name: Test
      run: pnpm --filter flow-editor exec vitest run --reporter=junit --outputFile=junit.xml --shard=$(( ${{ matrix.shard }} + 1 ))/${{ strategy.job-total }}
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: junit-flow-editor-${{ matrix.shard }}
        path: junit.xml
        retention-days: 14
  triage:
    needs: test
    if: failure()
    runs-on:
    - self-hosted
    - linux
    - arm64
    - ci-typescript
    - small
    permissions:
      actions: write
      pull-requests: write
      checks: read
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v6
    - run: uvx --from ./tools/devprod devprod triage --run ${{ github.run_id }} --pr ${{ github.event.pull_request.number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        DEVPROD_AGENT: claude
