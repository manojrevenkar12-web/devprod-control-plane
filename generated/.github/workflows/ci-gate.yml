# Generated by `devprod workflows`. Do not edit; change src/devprod/ci/workflows.py.
name: ci-gate
'on':
  pull_request: {}
  merge_group: {}
permissions:
  contents: read
  checks: read
  actions: read
concurrency:
  group: ci-gate-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on:
    - self-hosted
    - linux
    - arm64
    - ci-python
    - small
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@v6
    - name: Wait for the module workflows this change needs
      run: uvx --from ./tools/devprod devprod gate-pr --base ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }} --head ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
