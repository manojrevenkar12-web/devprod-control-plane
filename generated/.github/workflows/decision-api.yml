# Generated by `devprod workflows`. Do not edit; change src/devprod/ci/workflows.py.
name: ci / decision-api
'on':
  pull_request:
    paths:
    - services/decision-api/**
    - services/agent-runtime/**
    - services/audit-log/**
    - services/auth/**
    - services/connectors-banking/**
    - libs/core/**
    - libs/decision-runtime/**
    - libs/schemas/**
    - .github/workflows/decision-api.yml
  merge_group: {}
permissions:
  contents: read
concurrency:
  group: ci-decision-api-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on:
    - self-hosted
    - linux
    - arm64
    - ci-python
    - small
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - id: plan
      run: echo "shards=$(uvx --from ./tools/devprod devprod plan-shards decision-api --target-minutes 6 --max 8)" >> "$GITHUB_OUTPUT"
  test:
    needs: plan
    runs-on:
    - self-hosted
    - linux
    - arm64
    - ci-python
    - medium
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: |-
          uv.lock
          services/decision-api/pyproject.toml
        cache-suffix: decision-api
    - run: uv sync --frozen --package decision-api
    - name: Test
      run: |-
        uvx --from ./tools/devprod devprod shard-tests decision-api --shard ${{ matrix.shard }} > tests.txt
        uv run --package decision-api pytest -q -p no:cacheprovider --junitxml=junit.xml $(cat tests.txt)
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: junit-decision-api-${{ matrix.shard }}
        path: junit.xml
        retention-days: 14
  triage:
    needs: test
    if: failure()
    runs-on:
    - self-hosted
    - linux
    - arm64
    - ci-python
    - small
    permissions:
      actions: write
      pull-requests: write
      checks: read
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v6
    - run: uvx --from ./tools/devprod devprod triage --run ${{ github.run_id }} --pr ${{ github.event.pull_request.number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        DEVPROD_AGENT: claude
