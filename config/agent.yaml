# The CI triage agent (our Claudius): which model, what it may do on its own, and its budget.
model: claude-sonnet-5-5
fallback_model: claude-haiku-5-5
max_turns: 12
max_budget_usd_per_failure: 0.40
provider: simulated               # simulated | claude (Claude Agent SDK; DEVPROD_AGENT overrides)
may_do_alone: [rerun_failed_jobs, comment, propose_quarantine]
needs_a_person: [quarantine_on_main, open_fix_pr, revert]
confirm_regression_by_rerun: true # a suspected regression is rerun once; only a repeat failure is called a regression
markers:
  infra: ["No space left on device", "Killed", "OOMKilled", "runner has received a shutdown signal",
          "lost communication with the server", "Could not resolve host: api.github.com"]
  dependency: ["Could not find a version that satisfies", "No matching distribution found",
               "npm ERR! code ETARGET", "npm ERR! 404", "Hash mismatch", "ERR_PNPM_FETCH_404"]
prices_usd_per_mtok: {claude-sonnet-5-5: [2.0, 10.0], claude-haiku-5-5: [0.10, 0.50]}
